name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test imports
        run: |
          python -c "import pandas, sklearn, matplotlib; print('Imports OK')"

      - name: Run EDA script (should create outputs/)
        run: |
          python src/eda.py

      - name: Run training script (should create outputs/best_model.joblib)
        run: |
          python src/train_model.py
