name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Show requirements.txt exists
        run: |
          ls -la
          ls -la data || true
          echo "---- requirements.txt ----"
          cat requirements.txt || true

      - name: Install dependencies (FORCED)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip list | head -n 50
          python -m pip show pandas || true

      - name: Verify imports
        run: |
          python -c "import pandas, sklearn, matplotlib; print('Imports OK')"
